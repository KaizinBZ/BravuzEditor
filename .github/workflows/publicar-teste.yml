name: Publicar versão de teste v0.9
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testes unitários e build Android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publicar pré-lançamento de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BravuzEditor-v0.9-html-beta.apk
          gh release create v0.9-html-beta BravuzEditor-v0.9-html-beta.apk --target "$GITHUB_SHA" --title 'BravuzEditor v0.9 — prévia HTML beta' --notes 'Beta experimental: visualizador HTML com CSS/JavaScript local, controles interativos e recursos relativos incluídos no APK/ZIP. Rede externa, navegação externa e acesso à ponte Android estão bloqueados. Arquivos da mesma pasta até 25 MiB são copiados para a prévia. O conversor Pawn também está incluído, ainda pendente de validação .pwn→.amx em dispositivo. Build de teste; assinatura debug, podendo exigir backup e desinstalação da anterior. Não force atualização.' --prerelease

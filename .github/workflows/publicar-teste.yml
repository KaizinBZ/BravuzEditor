name: Publicar versão de teste v0.8
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testes unitários e build Android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publicar pré-lançamento de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BravuzEditor-v0.8-pawn-beta.apk
          gh release create v0.8-pawn-beta BravuzEditor-v0.8-pawn-beta.apk --target "$GITHUB_SHA" --title 'BravuzEditor v0.8 — compilador Pawn beta' --notes 'Beta experimental com compilador Pawn 3.10.10 integrado. Build Android compilado no CI; a compilação real .pwn→.amx ainda precisa ser validada em aparelho. Assinatura debug: pode ser preciso fazer backup e desinstalar versões anteriores (isso pode apagar dados). Inclui -Z; forneça os includes SA-MP/plugins junto ao .pwn ou no ZIP da GM. Faça backup e teste num servidor de desenvolvimento. Beta, não release oficial.' --prerelease

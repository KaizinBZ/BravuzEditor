name: Publicar versão de teste v0.7
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testar e compilar
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publicar pré-lançamento de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BravuzEditor-v0.7-teste.apk
          gh release create v0.7-teste BravuzEditor-v0.7-teste.apk --target "$GITHUB_SHA" --title 'BravuzEditor v0.7 — teste' --notes 'Versão experimental para testar o aviso de atualização obrigatória. Não é versão oficial. A assinatura de teste é diferente da v0.6: faça backup e desinstale a anterior antes de instalar. Não há instalação silenciosa. APKs editados pelo aplicativo continuam sem assinatura.' --prerelease
